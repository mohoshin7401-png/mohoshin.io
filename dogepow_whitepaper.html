<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b1224;
  color:#eaf2ff;
  line-height:1.8;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.hero{
  background:linear-gradient(135deg,#102447,#1a2f5c);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:40px;
  margin-bottom:24px;
}

h1{
  font-size:56px;
  margin:0 0 10px;
  color:#3db7ff;
  line-height:1.2;
  word-break:break-word;
}

.subtitle{
  font-size:22px;
  color:#b8c6dd;
}

.badge{
  display:inline-block;
  margin-top:16px;
  padding:8px 16px;
  border-radius:999px;
  background:#0d6efd33;
  color:#52c7ff;
  font-weight:bold;
  font-size:16px;
}

.card{
  background:#1a2340;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:40px;
}

h2{
  color:#2fc3ff;
  font-size:42px;
  margin-top:36px;
  line-height:1.2;
}

h3{
  font-size:30px;
  margin-top:28px;
  line-height:1.3;
}

p, li{
  font-size:22px;
  color:#d7e1f2;
}

ul{
  padding-left:28px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin:20px 0;
  display:block;
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
}

th, td{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  text-align:left;
  font-size:20px;
}

th{
  color:#2fc3ff;
}

.note{
  background:#16304f;
  border-left:4px solid #2fc3ff;
  padding:16px;
  border-radius:12px;
  margin:20px 0;
}

.footer{
  margin-top:24px;
  padding:24px;
  border-radius:20px;
  background:#16233d;
  font-size:18px;
  color:#c9d5e7;
}

/* =========================
   Tablet (≤ 992px)
========================= */
@media (max-width: 992px){
  .hero,
  .card{
    padding:30px;
  }

  h1{
    font-size:44px;
  }

  .subtitle{
    font-size:20px;
  }

  h2{
    font-size:34px;
  }

  h3{
    font-size:26px;
  }

  p, li{
    font-size:20px;
  }

  th, td{
    font-size:18px;
    padding:12px;
  }
}

/* =========================
   Mobile (≤ 768px)
========================= */
@media (max-width: 768px){
  .container{
    padding:12px;
  }

  .hero,
  .card{
    padding:24px;
    border-radius:20px;
  }

  h1{
    font-size:34px;
  }

  .subtitle{
    font-size:18px;
  }

  .badge{
    font-size:14px;
    padding:7px 14px;
  }

  h2{
    font-size:28px;
    margin-top:28px;
  }

  h3{
    font-size:22px;
    margin-top:22px;
  }

  p, li{
    font-size:18px;
    line-height:1.7;
  }

  th, td{
    font-size:16px;
    padding:10px;
  }

  .footer{
    font-size:16px;
    padding:20px;
  }
}

/* =========================
   Small Mobile (≤ 480px)
========================= */
@media (max-width: 480px){
  .container{
    padding:10px;
  }

  .hero,
  .card{
    padding:18px;
    border-radius:16px;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:16px;
  }

  .badge{
    font-size:12px;
    padding:6px 12px;
  }

  h2{
    font-size:24px;
  }

  h3{
    font-size:20px;
  }

  p, li{
    font-size:16px;
  }

  ul{
    padding-left:22px;
  }

  th, td{
    font-size:14px;
    padding:8px;
  }

  .note{
    padding:14px;
  }

  .footer{
    font-size:14px;
    padding:16px;
  }
}
</style>
